<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">星河集市客服机器人 n8n 工作流预览</title>
  <desc id="desc">Webhook receives a customer question, retrieves local RAG context, branches on relevance, calls Ollama, and returns citations or human handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f8ff"/><stop offset="1" stop-color="#eeecff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3b327d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7568d9"/></marker>
  </defs>
  <rect width="1500" height="430" rx="26" fill="url(#bg)"/>
  <text x="56" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172033">星河集市客服助手 · n8n + RAG 工作流</text>
  <text x="56" y="91" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#657089">本地真实流程：检索可核验资料，模型只在有依据时回答</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(55 155)"><rect width="175" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="87" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Webhook</text><text x="87" y="68" font-size="13" fill="#657089">接收客服问题</text></g>
    <g transform="translate(285 155)"><rect width="175" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="87" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Validate Input</text><text x="87" y="68" font-size="13" fill="#657089">校验会话和消息</text></g>
    <g transform="translate(515 155)"><rect width="190" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="95" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Search Knowledge</text><text x="95" y="68" font-size="13" fill="#657089">/search · Top-K</text></g>
    <g transform="translate(760 155)"><rect width="190" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="95" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Relevant?</text><text x="95" y="68" font-size="13" fill="#657089">阈值判断</text></g>
    <g transform="translate(1005 100)"><rect width="205" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="102" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Ollama Chat</text><text x="102" y="68" font-size="13" fill="#657089">qwen3:4b</text></g>
    <g transform="translate(1255 100)"><rect width="190" height="100" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="95" y="42" font-size="15" font-weight="700" fill="#5b4bdb">Format Answer</text><text x="95" y="68" font-size="13" fill="#657089">回答 + 来源</text></g>
    <g transform="translate(1005 275)"><rect width="205" height="92" rx="18" fill="#fff8eb" stroke="#efc77f"/><text x="102" y="40" font-size="15" font-weight="700" fill="#9a681d">Human Handoff</text><text x="102" y="65" font-size="13" fill="#806020">无依据 / 敏感操作</text></g>
    <g transform="translate(1255 275)"><rect width="190" height="92" rx="18" fill="#fff" stroke="#dcd8ff"/><text x="95" y="40" font-size="15" font-weight="700" fill="#5b4bdb">Respond</text><text x="95" y="65" font-size="13" fill="#657089">统一 JSON 响应</text></g>
  </g>
  <g stroke="#7568d9" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 205 H280"/><path d="M460 205 H510"/><path d="M705 205 H755"/><path d="M950 180 H1000"/><path d="M1215 150 H1250"/><path d="M855 255 C855 320 930 320 1000 320"/><path d="M1215 320 H1250"/>
  </g>
  <text x="900" y="172" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5b4bdb">命中</text>
  <text x="900" y="307" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#9a681d">未命中 / 需人工</text>
  <g transform="translate(55 330)"><rect width="620" height="54" rx="12" fill="#fff" opacity=".75"/><text x="22" y="33" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#657089">资料：Markdown → Ollama Embedding → data/index.json → 本地 /search</text></g>
</svg>
