  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
